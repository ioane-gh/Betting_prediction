[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "champmodel"
version = "0.1.0"
description = "BTTS and Over 2.5 probability engine for the English Championship (EFL tier 2)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "requests>=2.31",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "typer>=0.9",
    "tabulate>=0.9",
]

[project.optional-dependencies]
mssql = ["pyodbc>=5.0"]
fbref = ["soccerdata>=1.6"]
dev = ["pytest>=7.4"]

[project.scripts]
champmodel = "champmodel.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
